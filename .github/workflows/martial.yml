name: martial

on:
  push:
    paths: ["martial/**", ".github/workflows/martial.yml"]
  pull_request:
    paths: ["martial/**", ".github/workflows/martial.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: martial

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: martial
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: martial
      - run: cargo test --locked
      - name: martial reviews its own documents
        shell: bash
        run: |
          cargo build --release --locked
          for doc in README.md CLAUDE.md AGENT_GUIDE.md; do
            ./target/release/martial check "$doc"
          done
          ./target/release/martial check integrations/claude-skill/SKILL.md --profile software-doc --repo .

  # The action other repositories use, run the way they run it.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean documents pass
        id: pass
        uses: ./martial
        with:
          files: martial/README.md martial/AGENT_GUIDE.md
      - name: A clean note passes under a given profile
        uses: ./martial
        with:
          files: martial/examples/clean/note.md
          profile: general
      - name: An edit with drift fails
        id: drift
        continue-on-error: true
        uses: ./martial
        with:
          files: martial/examples/drift/after.md
          profile: general
          args: --against martial/examples/drift/before.md
      - name: The action reported what it should
        working-directory: .
        env:
          PASS: ${{ steps.pass.outputs.verdict }}
          DRIFT: ${{ steps.drift.outcome }}
          DRIFT_VERDICT: ${{ steps.drift.outputs.verdict }}
        run: |
          echo "pass=$PASS drift=$DRIFT drift_verdict=$DRIFT_VERDICT"
          test "$PASS" = clean
          test "$DRIFT" = failure
          test "$DRIFT_VERDICT" = violated
