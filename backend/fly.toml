# Fly.io config for the desk backend (Render fallback / overflow)
# Deploy with: fly launch --config backend/fly.toml

app = "desk-backend"
primary_region = "fra"  # Frankfurt — closest to Munich

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true   # free tier — stops when idle, restarts on request
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
